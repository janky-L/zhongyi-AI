<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中医经典问答助手</title>
  <style>
    :root {
      --bg: #f8f6f2;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #8a8a8a;
      --accent: #b48a5a;
      --accent-hover: #9c764a;
      --border: #e3dccd;
      --border-light: #f0ece4;
      --danger: #b3261e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }

    header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    header .logo {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    header h1 {
      font-size: 1.5rem;
      margin: 0.25rem 0 0.5rem;
    }

    header p {
      color: var(--muted);
      margin: 0;
      font-size: 0.92rem;
    }

    #msg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      min-height: 320px;
      height: 420px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.98rem;
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
      margin-bottom: 1rem;
      transition: border-color 0.15s ease;
    }

    #msg:focus-within {
      border-color: var(--accent);
    }

    #msg .highlight {
      color: var(--accent);
      font-weight: 600;
    }

    #msg .err {
      color: var(--danger);
      font-weight: 600;
    }

    #input-row {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    #input {
      flex: 1;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-family: inherit;
      min-width: 0;
    }

    #input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(180, 138, 90, 0.15);
    }

    #send-btn {
      padding: 0.8rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    #send-btn:hover {
      background: var(--accent-hover);
    }

    #send-btn:disabled {
      background: #c8c8c8;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 0.6rem;
    }

    .status .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.35rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-hint {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🩺</div>
      <h1>中医经典问答助手</h1>
      <p>基于《伤寒论》《金匮要略》参考条文回答</p>
    </header>

    <div id="msg">
      <div class="empty-hint">输入问题开始询问，例如：<br><br>
        “桂枝汤是什么方？要温中？抑或解表？”<br>
        “荆芥发表汤适用于哪些证候？”
      </div>
    </div>

    <div id="input-row">
      <input id="input" type="text" placeholder="输入问题… 例如：桂枝汤温的是什么？” autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>

    <div class="status" id="status"></div>
  </div>

<script>
  const msgEl = document.getElementById('msg');
  const inputEl = document.getElementById('input');
  const btnEl = document.getElementById('send-btn');
  const statusEl = document.getElementById('status');

  let abortController = null;

  function setStatus(html, isLoading) {
    statusEl.innerHTML = '';
    if (isLoading) {
      const span = document.createElement('span');
      span.className = 'spinner';
      span.setAttribute('aria-hidden', 'true');
      statusEl.appendChild(span);
      statusEl.appendChild(document.createTextNode('思考中…'));
    } else {
      statusEl.textContent = '';
    }
  }

  function appendText(text) {
    msgEl.textContent = msgEl.textContent + text;
    msgEl.scrollTop = msgEl.scrollHeight;
  }

  async function sendMessage() {
    const message = inputEl.value.trim();
    if (!message) return;
    if (abortController) return;

    inputEl.value = '';
    msgEl.textContent = '';
    setStatus('请求中…', true);
    btnEl.disabled = true;
    abortController = new AbortController();

    try {
      const resp = await fetch(
        '/chat?sessionId=default&message=' + encodeURIComponent(message),
        {
          method: 'GET',
          headers: {
            'Accept': 'text/event-stream'
          },
          signal: abortController.signal
        }
      );

      if (!resp.ok) {
        throw new Error('请求失败，状态码：' + resp.status);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while (true) {
        const { value, done } = await reader.read();

        if (done) {
          buffer += decoder.decode();
          break;
        }

        buffer += decoder.decode(value, { stream: true });

        // SSE 以空行分隔完整消息
        const events = buffer.split(/\r?\n\r?\n/);
        buffer = events.pop() || '';

        for (const event of events) {
          const data = event
            .split(/\r?\n/)
            .filter(line => line.startsWith('data:'))
            .map(line => line.slice(5).replace(/^ /, ''))
            .join('\n');

          if (data) {
            appendText(data);
          }
        }
      }

      // 处理流结束时残留的最后一条消息
      if (buffer.trim()) {
        const data = buffer
          .split(/\r?\n/)
          .filter(line => line.startsWith('data:'))
          .map(line => line.slice(5).replace(/^ /, ''))
          .join('\n');

        if (data) {
          appendText(data);
        }
      }

      setStatus('已完成', false);
    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('已取消', false);
        return;
      }
      msgEl.innerHTML = '<span class="err">出错：' + (err.message || '未知错误') + '</span>';
      setStatus('', false);
      console.error(err);
    } finally {
      btnEl.disabled = false;
      abortController = null;
    }
  }

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // 页面加载时自动聚焦输入框
  inputEl.focus();
</script>
</body>
</html>
